packages:
  - apps/*
  - packages/*

# Supply-chain hardening: a version must be ~5 days old before it can be installed.
minimumReleaseAge: 7200
ignoreScripts: false

# Single source of truth for every third-party version. Exact pins only, no ranges.
catalog:
  "@neondatabase/serverless": 1.1.0
  "@radix-ui/react-slot": 1.3.3
  "@tailwindcss/postcss": 4.3.3
  "@types/node": 26.2.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  "class-variance-authority": 0.7.1
  clsx: 2.1.1
  "drizzle-kit": 0.31.10
  "drizzle-orm": 0.45.2
  "lucide-react": 1.34.0
  next: 16.3.2
  react: 19.2.8
  "react-dom": 19.2.8
  tailwindcss: 4.3.3
  "tailwind-merge": 3.6.0
  "tw-animate-css": 1.4.0
  typescript: 7.0.2
  vitest: 4.1.11
  zod: 4.4.3
